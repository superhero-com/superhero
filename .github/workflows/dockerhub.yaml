name: Dockerhub
on:
  workflow_dispatch: {}
  push:
    tags: [v*]
    branches: [main, staging, develop]
concurrency: ${{ github.workflow }}-${{ github.ref_name }}
jobs:
  buildx:
    name: Docker Buildx
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # needed for docker-package to be able to calculate the version
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ secrets.DOCKERHUB_REPO }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
          flavor: |
            latest=${{ contains(github.ref_name, '-rc.') && 'false' || 'auto' }}
      # Collect every secret whose name starts with one of PREFIXES and emit it as a
      # KEY=VALUE build-arg line, so new matching secrets are picked up automatically
      # without editing this workflow. PREFIXES is a space-separated list.
      # eg. PREFIXES: "VITE_ NEXT_PUBLIC_"
      - name: Collect prefixed secrets as build-args
        id: vite_args
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
          PREFIXES: "VITE_"
        run: |
          {
            echo 'build_args<<__BUILD_ARGS_EOF__'
            echo "$SECRETS_JSON" | jq -r --arg prefixes "$PREFIXES" '
              ($prefixes | split(" ") | map(select(length > 0))) as $p
              | to_entries[]
              | select(.key as $k | $p | any(. as $pre | $k | startswith($pre)))
              | "\(.key)=\(.value)"
            '
            echo '__BUILD_ARGS_EOF__'
          } >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secrets: |
            "GITHUB_TOKEN=${{ secrets.NPM_GITHUB_TOKEN }}"
          build-args: |
            ${{ steps.vite_args.outputs.build_args }}
  deploy_develop:
    if: github.ref_name == 'develop'
    name: Develop Deploy
    uses: ./.github/workflows/deploy_develop.yaml
    secrets: inherit
    needs: buildx
  deploy_staging:
    if: github.ref_name == 'staging'
    name: Staging Deploy
    uses: ./.github/workflows/deploy_staging.yaml
    secrets: inherit
    needs: buildx
  deploy_main:
    if: github.ref_name == 'main'
    name: Production Deploy
    uses: ./.github/workflows/deploy_main.yaml
    secrets: inherit
    needs: buildx
