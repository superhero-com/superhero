name: Preview PR

on:
  workflow_dispatch:
  push:
    branches: [develop]
  pull_request:
    types: [ opened, synchronize, reopened, closed ]

env:
  ENV: "stg"
  APP: "superhero"

concurrency: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}

jobs:
  main:
    runs-on: ubuntu-latest
    name: build
    concurrency:
      group: build-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
      cancel-in-progress: true
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Resolve slug (PR number if available, else branch name)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "BRANCH_SLUG=pr-${{ github.event.pull_request.number }}" >> $GITHUB_ENV
            echo "PR_NUMBER=${{ github.event.pull_request.number }}" >> $GITHUB_ENV
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "BRANCH_SLUG=$(echo '${{ github.ref_name }}' | sed 's|/|-|g')" >> $GITHUB_ENV
          else
            PR=$(gh pr list --repo ${{ github.repository }} --head ${{ github.ref_name }} --state open --json number --jq '.[0].number // ""')
            if [ -n "$PR" ]; then
              echo "BRANCH_SLUG=pr-${PR}" >> $GITHUB_ENV
              echo "PR_NUMBER=$PR" >> $GITHUB_ENV
            else
              echo "BRANCH_SLUG=$(echo '${{ github.ref_name }}' | sed 's|/|-|g')" >> $GITHUB_ENV
            fi
          fi
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata for docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ secrets.DOCKERHUB_REPO }}
          tags: |
            type=raw,value=${{ env.BRANCH_SLUG }}

      - name: Build and push docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          provenance: false
          no-cache: ${{ github.event_name == 'workflow_dispatch' || github.run_attempt > 1 }}
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secrets: |
            "GITHUB_TOKEN=${{ secrets.NPM_GITHUB_TOKEN }}"
          build-args: |
            VITE_WALLET_CONNECT_PROJECT_ID=${{ secrets.VITE_WALLET_CONNECT_PROJECT_ID }}
            VITE_X_OAUTH_CLIENT_ID=${{ secrets.VITE_X_OAUTH_CLIENT_ID }}

  stg_deploy:
    runs-on: ubuntu-latest
    name: PR deploy
    concurrency:
      group: deploy-${{ github.workflow }}-${{ github.event.pull_request.head.ref }}
      cancel-in-progress: false
    needs: main
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    steps:
      - uses: actions/checkout@v6
        with:
          repository: aeternity/gitops-apps-superhero
          ref: stg
          token: ${{ secrets.NPM_GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - name: Check the initial PR deployment status
        continue-on-error: true
        id: status
        uses: aeternity/ae-github-actions/deploy-status@v7.5.0
        with:
          url: https://${{ env.BRANCH_SLUG }}-${{ env.APP }}.${{ env.ENV }}.service.aepps.com
          timeout: 10

      - name: Staging deploy
        if: github.event.action == 'opened' || github.event.action == 'reopened' || (github.event.action == 'synchronize' && steps.status.outputs.status_code != '200')
        uses: aeternity/ae-github-actions/argocd-deploy@v7.5.0
        with:
          url-prefix: ${{ env.BRANCH_SLUG }}
          env: ${{ env.ENV }}
          app: ${{ env.APP }}
          domain: service.aepps.com
          git-sha: ${{ github.event.pull_request.head.sha }}

      - name: Staging PR Sync
        if: github.event.action == 'synchronize' && steps.status.outputs.status_code == '200'
        uses: aeternity/ae-github-actions/argocd-pr-sync@v7.5.0
        with:
          git-sha: ${{ github.event.pull_request.head.sha }}
          url-prefix: ${{ env.BRANCH_SLUG }}
          env: ${{ env.ENV }}
          app: ${{ env.APP }}
          domain: service.aepps.com

      - name: Push changes
        run: git pull --rebase origin stg && git push origin stg

      - name: Print PR url
        uses: peter-evans/create-or-update-comment@v5
        if: github.event.action == 'opened'
        with:
          issue-number: ${{ env.PR_NUMBER }}
          body: |
            ## 🧪 Preview Links 🔎️
            https://${{ env.BRANCH_SLUG }}-${{ env.APP }}.${{ env.ENV }}.service.aepps.com

      - name: Wait for the deployment to go live
        continue-on-error: true
        uses: aeternity/ae-github-actions/deploy-status@v7.5.0
        with:
          url: https://${{ env.BRANCH_SLUG }}-${{ env.APP }}.${{ env.ENV }}.service.aepps.com
          timeout: 300
          interval: 5
