name: Preview PR Cleanup on Close

on:
  pull_request:
    types: [closed]
  delete:

env:
  ENV: "stg"
  APP: "superhero"

jobs:
  resolve_slug:
    runs-on: ubuntu-latest
    name: Resolve branch slug
    if: github.event_name == 'pull_request' || (github.event_name == 'delete' && github.event.ref_type == 'branch')
    outputs:
      branch_slug: ${{ steps.slug.outputs.branch_slug }}
    steps:
      - name: Compute branch slug
        id: slug
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            SLUG="pr-${{ github.event.pull_request.number }}"
          else
            PR="$(gh pr list --repo ${{ github.repository }} --head '${{ github.event.ref }}' --state all --json number --jq '.[0].number // ""' || true)"
            if [ -n "$PR" ]; then
              SLUG="pr-${PR}"
            else
              SLUG="$(echo '${{ github.event.ref }}' | sed 's|/|-|g')"
            fi
          fi
          if [ -z "$SLUG" ]; then
            echo "::error::Could not resolve a non-empty branch slug for event '${{ github.event_name }}'"
            exit 1
          fi
          echo "branch_slug=${SLUG}" >> "$GITHUB_OUTPUT"

  stg_undeploy:
    runs-on: ubuntu-latest
    name: PR undeploy on close or branch delete
    needs: resolve_slug
    if: needs.resolve_slug.result == 'success'
    # Shares its group with stg_deploy in pr_preview.yaml (same slug, same
    # prefix): a deploy build can take several minutes, long enough to still
    # be running when the PR behind it merges and closes. Serializing the two
    # under one group, keyed by PR number rather than head branch name (which
    # a release PR can share with many other PRs), keeps whichever started
    # first from being overtaken by the other and makes sure this job's commit
    # always applies on top of any deploy still in flight for the same PR
    # instead of possibly running before it or racing to push after it.
    concurrency:
      group: preview-deploy-${{ needs.resolve_slug.outputs.branch_slug }}
      cancel-in-progress: false
    env:
      BRANCH_SLUG: ${{ needs.resolve_slug.outputs.branch_slug }}

    steps:
      - uses: actions/checkout@v6
        with:
          repository: aeternity/gitops-apps-superhero
          ref: stg
          token: ${{ secrets.NPM_GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - name: Staging undeploy
        id: undeploy
        uses: aeternity/ae-github-actions/argocd-undeploy@v7
        with:
          url-prefix: ${{ env.BRANCH_SLUG }}
          env: ${{ env.ENV }}
          app: ${{ env.APP }}
          domain: service.aepps.com

      - name: Push changes
        if: steps.undeploy.conclusion == 'success'
        run: git pull --rebase origin stg && git push origin stg
