# This workflow is only for inclusion in other workflows.
name: Deploy via ssh
on:
  workflow_call:
    inputs:
      VERSION:
        description: "Version to deploy (dockerhub tag)"
        required: false
        default: "main"
        type: string
      CONTAINER_NAME:
        description: "Container name"
        default: "superhero"
        required: false
        type: string
      NOSTR_RELAY_URLS:
        description: "Comma-separated wss:// chat relays. Read at RUNTIME by server/index.cjs for both window.__SUPERCONFIG__ and the CSP connect-src, so the client and the header can never disagree. Empty => chat dark-ships (no entry points). Deliberately not a VITE_ build arg: that would reach the bundle but not the CSP, so chat would render and every socket would be blocked."
        required: false
        type: string
        default: ""
    secrets:
      DEPLOY_HOST:
        description: "Host to deploy to"
        required: true
      DEPLOY_USERNAME:
        description: "Username to use for ssh"
        required: true
      DEPLOY_KEY:
        description: "SSH key to use for ssh"
        required: true
      HOST_PORT:
        description: "Host port"
        required: true
      DOCKERHUB_USERNAME:
        description: "Dockerhub username"
        required: true
      DOCKERHUB_TOKEN:
        description: "Dockerhub password"
        required: true
      DOCKERHUB_REPO:
        description: "Dockerhub repository"
        required: true
jobs:
  deploy:
    name: Deploy via ssh
    runs-on: ubuntu-latest
    steps:
      - name: Run deploy script
        uses: appleboy/ssh-action@v1
        env:
          VERSION: "${{ inputs.VERSION }}"
          SHA: "${{ github.sha }}"
          HOST_DATA_DIR: "./${{ inputs.CONTAINER_NAME }}"
        with:
          host: "${{ secrets.DEPLOY_HOST }}"
          username: "${{ secrets.DEPLOY_USERNAME }}"
          key: "${{ secrets.DEPLOY_KEY }}"
          envs: >
            HOST_DATA_DIR,
            SHA
          script: |
            echo $SHA > $HOST_DATA_DIR/REVISION || true
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            docker pull ${{ secrets.DOCKERHUB_REPO }}:${{ inputs.VERSION }} || true
            docker stop ${{ inputs.CONTAINER_NAME }} || true
            docker rm ${{ inputs.CONTAINER_NAME }} || true
            docker run -d --name ${{ inputs.CONTAINER_NAME }} \
              --restart=always \
              --log-driver json-file \
              --log-opt max-size=100m \
              --log-opt max-file=30 \
              -p ${{secrets.HOST_PORT}}:80 \
              -e NODE_ENV=production \
              -e NOSTR_RELAY_URLS="${{ inputs.NOSTR_RELAY_URLS }}" \
              ${{ secrets.DOCKERHUB_REPO }}:${{ inputs.VERSION }}
